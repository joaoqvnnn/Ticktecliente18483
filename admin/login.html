<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-login-body">
    <!-- Conteúdo Principal -->
    <section class="admin-login-main">
        <div class="admin-login-container">
            
            <!-- Card de Login -->
            <div class="admin-login-card">
                
                <!-- Cabeçalho -->
                <div class="admin-login-header">
                    <div class="admin-login-logo">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1>Painel Administrativo</h1>
                    <p></p>
                </div>
                
                <!-- Formulário -->
                <form class="admin-login-form">
                    
                    <!-- Campo E-mail -->
                    <div class="form-group">
                        <label for="admin-email">E-mail *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="admin-email" required>
                        </div>
                    </div>
                    
                    <!-- Campo Senha -->
                    <div class="form-group">
                        <label for="admin-senha">Senha *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="admin-senha" required>
                            <button type="button" class="btn-toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Opções -->
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Lembrar de mim
                        </label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    
                    <!-- Botão de Login -->
                    <button type="submit" class="btn-admin-login">
                        <i class="fas fa-sign-in-alt"></i> Entrar no Painel
                    </button>
                </form>
                
                <!-- Divisor -->
                <div class="auth-divider">
                    <span>ou</span>
                </div>
                
                <!-- Autenticação 2FA -->
                <div class="admin-2fa-link">
                    <a href="2fa.html">
                        <i class="fas fa-shield-alt"></i> Autenticação em Dois Fatores
                    </a>
                </div>
            </div>
            
            <!-- Informações de Segurança -->
            <div class="admin-login-security">
                <div class="security-item">
                    <i class="fas fa-lock"></i>
                    <div>
                        <h3>Acesso Restrito</h3>
                        <p></p>
                    </div>
                </div>
                
                <div class="security-item">
                    <i class="fas fa-shield-alt"></i>
                    <div>
                        <h3>Proteção 2FA</h3>
                        <p></p>
                    </div>
                </div>
                
                <div class="security-item">
                    <i class="fas fa-history"></i>
                    <div>
                        <h3>Auditoria Completa</h3>
                        <p></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="admin-login-footer">
        <p>&copy; 2024 - Painel Administrativo - Todos os direitos reservados</p>
        <div class="admin-login-footer-links">
            <a href="../../termos.html">Termos</a>
            <a href="../../privacidade.html">Privacidade</a>
            <a href="../../contato.html">Suporte</a>
        </div>
    </footer>

    <script src="../../js/script.js"></script>
</body>
</html>
