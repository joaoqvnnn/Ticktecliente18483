<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente Loading</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Loading Spinner Básico -->
    <div class="loading-spinner">
        <div class="spinner"></div>
    </div>

    <!-- Loading com Texto -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text"></p>
    </div>

    <!-- Loading Full Page -->
    <div class="loading-fullpage">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <div class="loading-spinner"></div>
            <p class="loading-text"></p>
        </div>
    </div>

    <!-- Loading de Página -->
    <div class="page-loader">
        <div class="page-loader-spinner"></div>
    </div>

    <!-- Loading de Botão -->
    <button class="btn-loading" disabled>
        <span class="btn-spinner"></span>
        Carregando...
    </button>

    <!-- Loading de Card -->
    <div class="card-loading">
        <div class="card-loading-image"></div>
        <div class="card-loading-content">
            <div class="card-loading-line"></div>
            <div class="card-loading-line short"></div>
            <div class="card-loading-line medium"></div>
        </div>
    </div>

    <!-- Skeleton Loading -->
    <div class="skeleton-loading">
        <div class="skeleton-header">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-text">
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
        <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
        </div>
        <div class="skeleton-image"></div>
    </div>

    <!-- Loading de Progresso -->
    <div class="loading-progress">
        <div class="progress-header">
            <span class="progress-label"></span>
            <span class="progress-percentage">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Loading Circular com Porcentagem -->
    <div class="loading-circular">
        <div class="circular-progress">
            <div class="circular-spinner"></div>
            <div class="circular-text">0%</div>
        </div>
    </div>

    <!-- Loading de Upload -->
    <div class="loading-upload">
        <div class="upload-icon">
            <i class="fas fa-cloud-upload-alt"></i>
        </div>
        <div class="loading-progress">
            <div class="progress-bar">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
        <p class="loading-text"></p>
    </div>

    <!-- Loading de Pagamento -->
    <div class="loading-payment">
        <div class="payment-loading-icon">
            <i class="fas fa-credit-card"></i>
        </div>
        <div class="loading-spinner"></div>
        <p class="loading-text"></p>
        <div class="loading-steps">
            <div class="loading-step active">
                <i class="fas fa-check"></i>
                <span>Validando dados</span>
            </div>
            <div class="loading-step">
                <div class="step-spinner"></div>
                <span>Processando pagamento</span>
            </div>
            <div class="loading-step">
                <i class="fas fa-circle"></i>
                <span>Confirmando</span>
            </div>
        </div>
    </div>

    <!-- Loading de Busca -->
    <div class="loading-search">
        <div class="search-loading-icon">
            <i class="fas fa-search"></i>
        </div>
        <p class="loading-text"></p>
    </div>

    <!-- Loading de Refresh -->
    <div class="loading-refresh">
        <i class="fas fa-sync-alt fa-spin"></i>
        <span>Atualizando...</span>
    </div>

    <!-- Loading Dots -->
    <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Loading Pulse -->
    <div class="loading-pulse">
        <i class="fas fa-ticket-alt fa-pulse"></i>
    </div>

    <!-- Loading Shimmer -->
    <div class="loading-shimmer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay">
        <div class="loading-overlay-content">
            <div class="loading-spinner"></div>
            <p class="loading-text"></p>
        </div>
    </div>

    <!-- Loading com Logo Animada -->
    <div class="loading-branded">
        <div class="branded-logo">
            <i class="fas fa-ticket-alt"></i>
        </div>
        <div class="branded-spinner">
            <div class="spinner"></div>
        </div>
        <p class="loading-text"></p>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
