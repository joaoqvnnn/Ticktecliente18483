<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
    <!-- Header Simplificado -->
    <header class="auth-header">
        <div class="auth-header-container">
            <div class="logo">
                <a href="../index.html"></a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="logout-main">
        <div class="logout-container">
            
            <!-- Ícone -->
            <div class="logout-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            
            <!-- Título -->
            <h1>Você saiu da sua conta</h1>
            <p class="logout-description"></p>
            
            <!-- Informações -->
            <div class="logout-info">
                <div class="logout-info-item">
                    <i class="fas fa-shield-alt"></i>
                    <p></p>
                </div>
                
                <div class="logout-info-item">
                    <i class="fas fa-clock"></i>
                    <p></p>
                </div>
            </div>
            
            <!-- Ações -->
            <div class="logout-actions">
                <a href="login.html" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Fazer Login Novamente
                </a>
                
                <a href="../index.html" class="btn-secondary">
                    <i class="fas fa-home"></i> Voltar ao Início
                </a>
            </div>
            
            <!-- Sugestões -->
            <div class="logout-suggestions">
                <h3>Você também pode gostar</h3>
                
                <div class="logout-event-suggestions">
                    <a href="../eventos.html" class="logout-event-card">
                        <i class="fas fa-music"></i>
                        <span>Shows</span>
                    </a>
                    
                    <a href="../eventos.html" class="logout-event-card">
                        <i class="fas fa-theater-masks"></i>
                        <span>Teatro</span>
                    </a>
                    
                    <a href="../eventos.html" class="logout-event-card">
                        <i class="fas fa-futbol"></i>
                        <span>Esportes</span>
                    </a>
                </div>
            </div>
            
            <!-- Ajuda -->
            <div class="logout-help">
                <p>Precisa de ajuda? <a href="../contato.html">Fale Conosco</a></p>
            </div>
        </div>
    </section>

    <!-- Footer Simplificado -->
    <footer class="auth-footer">
        <div class="auth-footer-container">
            <p>&copy; 2024 - Todos os direitos reservados</p>
            <div class="auth-footer-links">
                <a href="../termos.html">Termos</a>
                <a href="../privacidade.html">Privacidade</a>
                <a href="../contato.html">Contato</a>
            </div>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
